name: Mobile APK

on:
  push:
    branches: [main, claude/**]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-apk.yml'
  workflow_dispatch: {}

jobs:
  build-apk:
    runs-on: ubuntu-latest
    # contents:write pra poder publicar/atualizar a Release abaixo — o
    # padrão em alguns repositórios é read-only, o que faria esse passo
    # falhar com 403 sem isso.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Instalar dependências JS
        working-directory: mobile
        run: npm ci

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Runners ubuntu-latest já vêm com o Android SDK pré-instalado
      # (ANDROID_HOME já setado) — só falta garantir a plataforma/
      # build-tools que o projeto usa. A action de terceiros
      # android-actions/setup-android vinha falhando sem log útil, então
      # trocamos pelo sdkmanager que já está na imagem.
      - name: Instalar plataforma/build-tools do Android
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -1)"
          echo "Usando sdkmanager em: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"

      # Push notifications (Firebase) são opcionais, igual
      # GOOGLE_MAPS_API_KEY/GOOGLE_WEB_CLIENT_ID abaixo: sem o secret
      # GOOGLE_SERVICES_JSON configurado, este passo não escreve nada e
      # o build continua normal (android/app/build.gradle só aplica o
      # plugin do Google Services se o arquivo existir). Ver
      # mobile/README.md > "Notificações push" pra gerar esse secret.
      - name: Escrever google-services.json (se configurado)
        working-directory: mobile/android/app
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > google-services.json
          fi

      # "debug" não serve pra instalar standalone: ele não empacota o
      # JS dentro do APK, espera um Metro Bundler rodando no PC pra
      # carregar o código pela rede (por isso dá "Unable to load
      # script" ao abrir sem o Metro por perto). "release" embute o JS
      # Hermes compilado direto no APK — aqui ele é assinado com a
      # debug.keystore padrão (ver android/app/build.gradle), não a de
      # uma loja de verdade, mas funciona pra instalar e testar.
      # GOOGLE_MAPS_API_KEY/GOOGLE_WEB_CLIENT_ID são opcionais — sem
      # configurar esses secrets no repositório (Settings > Secrets and
      # variables > Actions), o build continua funcionando normal, só
      # que sem autocomplete de endereço nem login Google (degrada pra
      # texto livre, como já documentado no README do mobile/).
      - name: Buildar APK release (standalone, sem precisar de Metro)
        working-directory: mobile/android
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Publicar APK como artefato do workflow
        uses: actions/upload-artifact@v4
        with:
          name: konectaja-apk
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      # Além do artefato acima (só acessível com login no GitHub e some
      # em 30 dias), publica numa Release de tag fixa ("app-mobile") —
      # é nela que o backend busca o APK pra servir o link de download
      # público do site (sem precisar de conta no GitHub).
      - name: Publicar na Release "app-mobile" (link usado pelo site)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-mobile
          name: App Android — build mais recente
          body: Build mais recente do app Android, gerado automaticamente a cada atualização do código em mobile/.
          files: mobile/android/app/build/outputs/apk/release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
