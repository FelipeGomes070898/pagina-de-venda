name: Mobile APK

on:
  push:
    branches: [main, claude/**]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-apk.yml'
  workflow_dispatch: {}

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Instalar dependências JS
        working-directory: mobile
        run: npm ci

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Runners ubuntu-latest já vêm com o Android SDK pré-instalado
      # (ANDROID_HOME já setado) — só falta garantir a plataforma/
      # build-tools que o projeto usa. A action de terceiros
      # android-actions/setup-android vinha falhando sem log útil, então
      # trocamos pelo sdkmanager que já está na imagem.
      - name: Instalar plataforma/build-tools do Android
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -1)"
          echo "Usando sdkmanager em: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"

      # "debug" não serve pra instalar standalone: ele não empacota o
      # JS dentro do APK, espera um Metro Bundler rodando no PC pra
      # carregar o código pela rede (por isso dá "Unable to load
      # script" ao abrir sem o Metro por perto). "release" embute o JS
      # Hermes compilado direto no APK — aqui ele é assinado com a
      # debug.keystore padrão (ver android/app/build.gradle), não a de
      # uma loja de verdade, mas funciona pra instalar e testar.
      - name: Buildar APK release (standalone, sem precisar de Metro)
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Publicar APK como artefato do workflow
        uses: actions/upload-artifact@v4
        with:
          name: konectaja-apk
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
