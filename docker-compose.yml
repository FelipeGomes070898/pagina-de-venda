services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: vexo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - vexo_db_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: vexo
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: ${JWT_SECRET:-troque-este-valor-em-producao}
      JWT_EXPIRES_ADMIN: 8h
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      ASAAS_ENV: ${ASAAS_ENV:-sandbox}
      ASAAS_API_KEY: ${ASAAS_API_KEY:-}
      ASAAS_WEBHOOK_TOKEN: ${ASAAS_WEBHOOK_TOKEN:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      PORT: 3333
    ports:
      - '3333:3333'
    # Aplica as migrations (idempotentes — CREATE TABLE IF NOT EXISTS)
    # toda vez que sobe, depois inicia o servidor. Sem isso, um `docker
    # compose up` num banco novo derrubaria a API por falta de tabelas.
    command: sh -c "node src/config/setup.js && node server.js"

volumes:
  vexo_db_data:
